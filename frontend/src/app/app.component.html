<header class="app-header">
  <a class="brand" routerLink="/" aria-label="WEBDEV MMORPG Office View">✧ WEBDEV <small>MMORPG · ANGULAR EDITION</small></a>
  <nav aria-label="Primary navigation">
    <a routerLink="/" [routerLinkActiveOptions]="{exact:true}" routerLinkActive="active">OFFICE VIEW</a>
    <a routerLink="/game" routerLinkActive="active"><span aria-hidden="true">⌘</span> GAME VIEW</a>
    <a routerLink="/characters" routerLinkActive="active">CHARACTERS</a>
    <a routerLink="/settings/game" routerLinkActive="active">SETTINGS</a>
    <a routerLink="/operations" routerLinkActive="active">OPERATIONS</a>
  </nav>
  <span class="stream-state" [attr.data-state]="(jira.connection$ | async)?.state">
    <i aria-hidden="true"></i>{{(jira.connection$ | async)?.state || 'connecting'}}
  </span>
  <span class="stack">ANGULAR · GO · SQLITE</span>
</header>
<router-outlet></router-outlet>
